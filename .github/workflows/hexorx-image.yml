name: Hexorx release image

on:
  pull_request:
    branches: [hexorx]
  push:
    branches: [hexorx]
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to publish; requires Josh approval before dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hexorx-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/hexorx' }}

jobs:
  verify:
    if: github.repository == 'hexorx/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate manual source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Test release publish gate
        run: node --test scripts/hexorx-image.test.mjs
      # Root Vitest does not discover the runner node:test contracts.
      - name: Run runner node:test contracts
        run: node --test packages/paperclip-runner/test/*.test.mjs
      # The upstream root Vitest project list does not include Hermes.
      - run: pnpm --filter @paperclipai/hermes-paperclip-adapter test
      - run: pnpm --filter @paperclipai/hermes-paperclip-adapter typecheck
      - run: pnpm --filter @paperclipai/hermes-paperclip-adapter build
      - run: git diff --exit-code

  workspace:
    if: github.repository == 'hexorx/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install the repository-pinned Rust toolchain
        working-directory: packages/paperclip-runner
        run: rustup show
      - run: pnpm -r typecheck
      - run: pnpm build

  tests:
    if: github.repository == 'hexorx/paperclip'
    name: tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: general-server-1
            args: --mode general --group general-server --shard-index 0 --shard-count 5
          - label: general-server-2
            args: --mode general --group general-server --shard-index 1 --shard-count 5
          - label: general-server-3
            args: --mode general --group general-server --shard-index 2 --shard-count 5
          - label: general-server-4
            args: --mode general --group general-server --shard-index 3 --shard-count 5
          - label: general-server-5
            args: --mode general --group general-server --shard-index 4 --shard-count 5
          - label: general-workspaces-a-1
            args: --mode general --group general-workspaces-a --shard-index 0 --shard-count 2
          - label: general-workspaces-a-2
            args: --mode general --group general-workspaces-a --shard-index 1 --shard-count 2
          - label: general-workspaces-b-1
            args: --mode general --group general-workspaces-b
          - label: serialized-1
            args: --mode serialized --shard-index 0 --shard-count 5
          - label: serialized-2
            args: --mode serialized --shard-index 1 --shard-count 5
          - label: serialized-3
            args: --mode serialized --shard-index 2 --shard-count 5
          - label: serialized-4
            args: --mode serialized --shard-index 3 --shard-count 5
          - label: serialized-5
            args: --mode serialized --shard-index 4 --shard-count 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Use upstream's test partitioner; all general and serialized suites remain required.
      - run: pnpm run preflight:workspace-links
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - run: node scripts/run-vitest-stable.mjs ${{ matrix.args }}

  image:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read version
        id: version
        run: |
          version="$(cat .hexorx-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-hex\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.version.outputs.value }}
            PAPERCLIP_BUILD_COMMIT=${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hexorx' && github.repository == 'hexorx/paperclip'
    needs: [verify, workspace, tests, image]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read version
        id: version
        run: echo "value=$(cat .hexorx-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing image tags
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          token="$(curl --fail --silent --show-error --user "$GHCR_USER:$GHCR_PASSWORD" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:hexorx/paperclip:pull' | jq -er '.token')"
          echo "::add-mask::$token"
          for tag in "$IMAGE_VERSION" "sha-$SOURCE_REF"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/hexorx/paperclip/manifests/$tag")"
            if [[ "$status" != 404 ]]; then
              echo "::error::Refusing to publish $tag: registry returned $status (only 404 permits a new tag)."
              exit 1
            fi
          done
      - name: Publish reviewed production image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hexorx/paperclip:${{ steps.version.outputs.value }}
            ghcr.io/hexorx/paperclip:sha-${{ inputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/hexorx/paperclip
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.version.outputs.value }}
            PAPERCLIP_BUILD_COMMIT=${{ inputs.ref }}
      - name: Record immutable image
        env:
          SOURCE_REF: ${{ inputs.ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Image: ghcr.io/hexorx/paperclip:$IMAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ghcr.io/hexorx/paperclip@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
